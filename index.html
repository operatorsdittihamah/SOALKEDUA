<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower Adjectives Quest - Realistic Animal Edition</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #81d4fa 0%, #aed581 50%, #689f38 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #3e2723;
    overflow: hidden;
    position: relative;
}

/* =========================================
   DEKORASI BACKGROUND (POHON, BUAH, BUNGA)
========================================= */
.garden-background {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
}

.sun {
    position: absolute;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff59d 0%, #ffd54f 65%, #ffca28 100%);
    top: 6%;
    right: 7%;
    box-shadow: 0 0 35px rgba(255,193,7,0.5);
}

.cloud {
    position: absolute;
    background: white;
    width: 110px;
    height: 35px;
    border-radius: 30px;
    opacity: 0.8;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.05));
}
.cloud::before, .cloud::after {
    content: ""; position: absolute; background: white; border-radius: 50%;
}
.cloud::before { width: 48px; height: 48px; left: 18px; top: -22px; }
.cloud::after { width: 58px; height: 58px; right: 14px; top: -28px; }
.cloud-1 { top: 8%; left: 5%; }
.cloud-2 { top: 18%; left: 40%; transform: scale(0.7); }

/* Hutan & Pohon Rindang */
.tree-forest {
    position: absolute;
    bottom: 90px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
    font-size: 80px;
    z-index: 2;
    opacity: 0.95;
}

/* Buah-Buahan di Atas Pohon */
.fruits-layer {
    position: absolute;
    bottom: 140px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    font-size: 28px;
    z-index: 3;
}

.grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 120px;
    background: linear-gradient(0deg, #33691e 0%, #558b2f 70%, rgba(85,139,47,0) 100%);
    z-index: 3;
}

/* Bunga Melimpah */
.flower-garden {
    position: absolute;
    bottom: 10px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    padding: 0 5px;
    font-size: 38px;
    z-index: 4;
}

.flower {
    display: inline-block;
    animation: flowerSway 3s ease-in-out infinite alternate;
    transform-origin: bottom center;
}
.flower:nth-child(even) { animation-delay: 0.5s; animation-duration: 4s; }
@keyframes flowerSway {
    from { transform: rotate(-6deg); }
    to { transform: rotate(6deg); }
}

/* =========================================
   ANIMASI GERAK REALISTIS BINATANG
========================================= */
.walking-animal-wrapper {
    position: fixed;
    z-index: 100; /* Paling depan melintasi kotak soal */
    pointer-events: none;
    display: none;
}

.walking-animal {
    font-size: 115px;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.35));
    display: inline-block;
}

/* 1. Animasi Gerak Kepak Sayap Kupu-Kupu / Burung */
.wing-flap {
    animation: flap 0.25s ease-in-out infinite alternate;
}
@keyframes flap {
    0% { transform: scaleX(1) scaleY(1) rotate(0deg); }
    100% { transform: scaleX(0.4) scaleY(1.1) rotate(12deg); }
}

/* 2. Animasi Langkah Kaki / Gerak Tubuh Macan, Kucing, dll */
.limb-walk {
    animation: walkLimb 0.35s ease-in-out infinite alternate;
}
@keyframes walkLimb {
    0% { transform: translateY(0) rotate(-4deg); }
    100% { transform: translateY(-12px) rotate(4deg); }
}

/* 3. Animasi Merayap Ular (Meliuk-liuk) */
.snake-slither {
    animation: slither 0.4s ease-in-out infinite alternate;
}
@keyframes slither {
    0% { transform: scaleY(0.8) skewX(-12deg); }
    100% { transform: scaleY(1.1) skewX(12deg); }
}

/* Jalur Lintasan Layar */
@keyframes moveLeftToRight {
    0% { left: -160px; }
    100% { left: 105vw; }
}

@keyframes moveRightToLeft {
    0% { left: 105vw; transform: scaleX(-1); }
    100% { left: -160px; transform: scaleX(-1); }
}

@keyframes moveTopToBottom {
    0% { top: -160px; }
    100% { top: 105vh; }
}

.animate-left-right { display: block; animation: moveLeftToRight linear forwards; }
.animate-right-left { display: block; animation: moveRightToLeft linear forwards; }
.animate-top-bottom { display: block; animation: moveTopToBottom linear forwards; }

/* CELEBRATION */
#celebrationContainer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 99; overflow: hidden;
}
.reward-item {
    position: absolute; top: -50px;
    animation: fall linear forwards;
}
@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
}

/* GAME CARD CONTAINER */
.game-card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border: 4px solid #aed581;
    box-shadow: 0 20px 40px rgba(62,39,35,0.25), inset 0 0 15px rgba(255,255,255,0.8);
    border-radius: 28px;
    padding: 25px;
    width: 90%;
    max-width: 480px;
    text-align: center;
    max-height: 94vh;
    overflow-y: auto;
}

.header-section {
    display: flex; align-items: center; justify-content: space-between;
    background: #f1f8e9; padding: 10px 18px; border-radius: 18px;
    margin-bottom: 15px; border: 2px solid #c5e1a5;
}
.avatar {
    width: 55px; height: 55px; border-radius: 50%;
    background: linear-gradient(135deg, #81c784, #66bb6a);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 4px 10px rgba(76,175,80,0.4); border: 3px solid white;
}
.stats-group { text-align: right; font-family: 'Fredoka', sans-serif; }
.stat-item { font-size: 13px; color: #558b2f; font-weight: 600; }
.stat-value { color: #33691e; font-weight: 700; font-size: 18px; }

.title {
    font-family: 'Fredoka', sans-serif; font-size: 26px;
    letter-spacing: 1px; color: #558b2f; margin-bottom: 10px;
    text-transform: uppercase; text-shadow: 1px 1px 0 white;
}
.progress-text {
    font-family: 'Fredoka', sans-serif; font-size: 15px;
    color: #689f38; font-weight: 600; margin-bottom: 12px; letter-spacing: 1px;
}

.question-box {
    background: #f9fff5; border-radius: 18px; padding: 15px;
    margin-bottom: 15px; border: 2px solid #dcedc8;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.03); min-height: 110px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
}
.question-img {
    max-width: 100%; max-height: 160px; border-radius: 12px;
    margin-bottom: 10px; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); object-fit: cover;
}
.question { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; color: #3e2723; line-height: 1.4; }

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
.option-btn {
    background: white; border: 2px solid #aed581; border-radius: 14px;
    padding: 12px 8px; color: #558b2f; font-family: 'Fredoka', sans-serif;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    text-align: center; outline: none; box-shadow: 0 3px 6px rgba(0,0,0,0.05);
}
.option-btn:hover { background: #f1f8e9; border-color: #7cb342; transform: translateY(-2px); }
.option-btn.selected { background: #7cb342; color: white; border-color: #558b2f; box-shadow: 0 4px 12px rgba(124,179,66,0.4); }

.select-box {
    width: 100%; padding: 14px; font-size: 16px; font-family: 'Fredoka', sans-serif;
    text-align: center; border: 2px solid #aed581; border-radius: 14px;
    background: white; color: #3e2723; outline: none; margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.btn {
    width: 100%; padding: 14px; font-family: 'Fredoka', sans-serif; font-size: 18px;
    font-weight: bold; border: none; border-radius: 14px; cursor: pointer;
    text-transform: uppercase; transition: all 0.3s ease; letter-spacing: 1px;
}
.btn-submit { background: linear-gradient(135deg, #8bc34a, #558b2f); color: white; box-shadow: 0 6px 16px rgba(85,139,47,0.3); }
.btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(85,139,47,0.4); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-start { background: linear-gradient(135deg, #66bb6a, #388e3c); color: white; box-shadow: 0 6px 16px rgba(56,142,60,0.3); }

.feedback { margin-top: 10px; font-weight: 700; min-height: 24px; font-size: 16px; font-family: 'Fredoka', sans-serif; }
.feedback.correct { color: #2e7d32; }
.feedback.wrong { color: #c62828; }

.screen { display: none; }
.active-screen { display: block; }

.final-score { font-family: 'Fredoka', sans-serif; font-size: 55px; color: #558b2f; text-shadow: 2px 2px 0 #dcedc8; margin: 10px 0; }
.result-details { font-size: 16px; color: #3e2723; margin-bottom: 20px; line-height: 1.6; }
.saving-status { font-size: 14px; color: #558b2f; margin-top: 10px; font-weight: bold; }

.matching-container { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
.matching-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
.matching-indonesia { background: #f1f8e9; border: 2px solid #aed581; border-radius: 12px; padding: 10px 8px; font-family: 'Fredoka', sans-serif; font-weight: 600; color: #558b2f; }
.matching-select { width: 100%; padding: 10px 6px; border: 2px solid #aed581; border-radius: 12px; background: white; color: #3e2723; font-family: 'Fredoka', sans-serif; font-size: 14px; outline: none; cursor: pointer; }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
}
.shake { animation: shake 0.4s ease-in-out; }
</style>
</head>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwri1QtRJdSiYlu0q1Jk8JQO1-7KscQzQYuZ-Ps-E8YE7geMkDrzMYl-GdKoWHWIB0A-g/exec";
const TOTAL_QUESTIONS = 20;
const POINTS_PER_QUESTION = 5;

const questionBank = [
    { type: "multiple", image: "gedung.jpg", text: "Look at the building. The building is _____.", options: ["Low", "High", "Weak", "Quiet"], answer: "High" },
    { type: "multiple", image: "pohon.jpg", text: "Look at the tree. The tree is _____.", options: ["Young", "New", "Old", "Fresh"], answer: "Old" },
    { type: "multiple", image: "tiger.jpg", text: "Look at the little tiger. The tiger is _____.", options: ["Young", "Old", "Ancient", "Grown"], answer: "Young" },
    { type: "multiple", image: "tas.jpg", text: "Look at the elephant carrying a big bag. It is _____.", options: ["Heavy", "Tiny", "Empty", "Weak"], answer: "Heavy" },
    { type: "multiple", image: "gelas.png", text: "Look at the glass. The glass is _____.", options: ["Full", "Heavy", "Empty", "Wet"], answer: "Empty" },
    { type: "multiple", image: "botol.jpg", text: "Look at the bottle. The bottle is _____.", options: ["Empty", "Full", "Broken", "Tiny"], answer: "Full" },
    { type: "multiple", image: "bocah.png", text: "Look at the smiling boy. He is _____.", options: ["Kind", "Cruel", "Rude", "Mean"], answer: "Kind" },
    { type: "multiple", image: "toy.jpg", text: "Look at a toy. The toy is _____.", options: ["New", "Perfect", "Broken", "Strong"], answer: "Broken" },
    { type: "multiple", image: "class.png", text: "Look at the classroom. The classroom is _____.", options: ["Messy", "Dirty", "Neat", "Noisy"], answer: "Neat" },
    { type: "multiple", image: "bayi.jpeg", text: "Look at the baby sleeping quietly. The baby is _____.", options: ["Awake", "Asleep", "Active", "Busy"], answer: "Asleep" },
    
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Angry", pairs: [{ indonesia: "Ramah", english: "Friendly" }, { indonesia: "Sopan", english: "Polite" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Honest", pairs: [{ indonesia: "Bodoh", english: "Silly" }, { indonesia: "Pintar", english: "Clever" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Brave", pairs: [{ indonesia: "Rajin", english: "Diligent" }, { indonesia: "Malas", english: "Lazy" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Modern", pairs: [{ indonesia: "Muda", english: "Young" }, { indonesia: "Tua", english: "Ancient" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Generous", pairs: [{ indonesia: "Kaya", english: "Rich" }, { indonesia: "Miskin", english: "Poor" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Strong", pairs: [{ indonesia: "Sehat", english: "Healthy" }, { indonesia: "Sakit", english: "Ill" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Cute", pairs: [{ indonesia: "Indah", english: "Beautiful" }, { indonesia: "Buruk", english: "Terrible" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Quick", pairs: [{ indonesia: "Mudah", english: "Easy" }, { indonesia: "Sulit", english: "Difficult" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Quiet", pairs: [{ indonesia: "Aman", english: "Safe" }, { indonesia: "Berbahaya", english: "Dangerous" }] },
    { type: "matching", text: "Jodohkan kata berikut dengan Bahasa Inggris yang tepat!", distractor: "Lucky", pairs: [{ indonesia: "Terkenal", english: "Famous" }, { indonesia: "Tidak dikenal", english: "Unknown" }] }
];

let selectedStudentName = "";
let currentQuestion = 1;
let selectedOption = null;
let score = 0;
let correctCount = 0;
const avatars = ["🌸", "🌷", "🌻", "🦋", "🌈", "🌺", "🏆"];
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (type === 'correct') {
        // Menggunakan suara tepuk tangan sintetis nada gembira anak-anak (aman & tanpa error internet)
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        let notes = [523.25, 659.25, 783.99, 1046.50]; // Nada chord gembira (C Major)
        notes.forEach((freq, index) => {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }, index * 80);
        });
    } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

function triggerCelebration() {
    const container = document.getElementById('celebrationContainer');
    const items = ['🌸', '🌷', '🌼', '🌻', '🌺', '⭐', '✨', '🦋'];
    for (let i = 0; i < 30; i++) {
        const item = document.createElement('div');
        item.className = 'reward-item';
        item.innerText = items[Math.floor(Math.random() * items.length)];
        item.style.left = Math.random() * 100 + '%';
        item.style.fontSize = (Math.random() * 20 + 20) + 'px';
        item.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        item.style.animationDelay = (Math.random() * 0.3) + 's';
        container.appendChild(item);
        setTimeout(() => item.remove(), 2500);
    }
}

async function fetchStudentNames() {
    const selectElem = document.getElementById('studentSelect');
    const startBtn = document.getElementById('startBtn');
    const feedback = document.getElementById('loginFeedback');
    try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const data = await response.json();
        if (data.names && data.names.length > 0) {
            selectElem.innerHTML = '<option value="">-- Pilih Namamu --</option>';
            data.names.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                selectElem.appendChild(opt);
            });
            startBtn.disabled = false;
        } else {
            selectElem.innerHTML = '<option value="">-- Tidak Ada Nama Ditemukan --</option>';
            feedback.innerText = "Daftar nama di Google Sheets masih kosong!";
        }
    } catch (err) {
        console.error(err);
        selectElem.innerHTML = '<option value="">-- Gagal Memuat --</option>';
        feedback.innerText = "Gagal terhubung ke Google Sheets.";
    }
}

function startGame(event) {
    event.preventDefault();
    selectedStudentName = document.getElementById('studentSelect').value;
    if (!selectedStudentName) return;
    document.getElementById('displayName').innerText = selectedStudentName;
    document.getElementById('loginScreen').classList.remove('active-screen');
    document.getElementById('quizScreen').classList.add('active-screen');
    generateQuestion();
}

function generateQuestion() {
    const q = questionBank[currentQuestion - 1];
    selectedOption = null;
    document.getElementById('progressText').innerText = `SOAL ${currentQuestion} DARI ${TOTAL_QUESTIONS}`;
    document.getElementById('questionText').innerText = q.text;
    const imgElem = document.getElementById('questionImage');
    
    if (q.image && q.image.trim() !== "") {
        imgElem.src = q.image;
        imgElem.style.display = "block";
    } else {
        imgElem.style.display = "none";
        imgElem.src = "";
    }
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    
    if (q.type === "multiple") {
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.type = 'button'; btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, opt);
            optionsContainer.appendChild(btn);
        });
    } else if (q.type === "matching") {
        const wrapper = document.createElement('div');
        wrapper.className = 'matching-container';
        
        const englishAnswers = [...q.pairs.map(pair => pair.english), q.distractor].sort(() => Math.random() - 0.5);
        
        q.pairs.forEach(pair => {
            const row = document.createElement('div');
            row.className = 'matching-row';
            const indonesia = document.createElement('div');
            indonesia.className = 'matching-indonesia';
            indonesia.innerText = pair.indonesia;
            
            const select = document.createElement('select');
            select.className = 'matching-select';
            select.dataset.answer = pair.english;
            
            const defaultOption = document.createElement('option');
            defaultOption.value = ""; defaultOption.innerText = "-- Pilih --";
            select.appendChild(defaultOption);
            
            englishAnswers.forEach(answer => {
                const option = document.createElement('option');
                option.value = answer; option.innerText = answer;
                select.appendChild(option);
            });
            select.addEventListener('change', checkMatchingComplete);
            
            row.appendChild(indonesia);
            row.appendChild(select);
            wrapper.appendChild(row);
        });
        optionsContainer.appendChild(wrapper);
    }
    document.getElementById('submitBtn').disabled = true;
}

function selectOption(btnElem, value) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btnElem.classList.add('selected');
    selectedOption = value;
    document.getElementById('submitBtn').disabled = false;
}

function checkMatchingComplete() {
    const selects = document.querySelectorAll('.matching-select');
    let complete = true;
    let selectedValues = [];
    selects.forEach(select => {
        if (select.value === "") complete = false;
        if (select.value !== "") selectedValues.push(select.value);
    });
    const hasDuplicate = new Set(selectedValues).size !== selectedValues.length;
    document.getElementById('submitBtn').disabled = !complete || hasDuplicate;
}

function checkAnswer(event) {
    event.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const feedback = document.getElementById('feedbackText');
    const gameCard = document.getElementById('gameCard');
    const currentQ = questionBank[currentQuestion - 1];
    
    submitBtn.disabled = true;
    let isCorrect = false;
    
    if (currentQ.type === "multiple") {
        if (!selectedOption) return;
        document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');
        isCorrect = selectedOption === currentQ.answer;
    } else if (currentQ.type === "matching") {
        const selects = document.querySelectorAll('.matching-select');
        isCorrect = true;
        selects.forEach(select => {
            if (select.value !== select.dataset.answer) isCorrect = false;
            select.disabled = true;
        });
    }
    
    if (isCorrect) {
        score += POINTS_PER_QUESTION;
        correctCount += 1;
        playSound('correct');
        triggerCelebration();
        feedback.innerText = "✨ Hebat! Semua jawaban benar!";
        feedback.className = "feedback correct";
    } else {
        playSound('wrong');
        feedback.innerText = "🌷 Ooo! Ada jawaban yang kurang tepat!";
        feedback.className = "feedback wrong";
        gameCard.classList.add('shake');
        setTimeout(() => gameCard.classList.remove('shake'), 400);
    }
    
    document.getElementById('score').innerText = score;
    updateAvatar();
    
    setTimeout(() => {
        feedback.innerText = "";
        if (currentQuestion < TOTAL_QUESTIONS) {
            currentQuestion++;
            generateQuestion();
        } else {
            showFinalResult();
        }
    }, 1400);
}

function updateAvatar() {
    const avatarElem = document.getElementById('avatarIcon');
    if (correctCount < 4) avatarElem.innerText = avatars[0];
    else if (correctCount < 8) avatarElem.innerText = avatars[1];
    else if (correctCount < 12) avatarElem.innerText = avatars[2];
    else if (correctCount < 16) avatarElem.innerText = avatars[3];
    else if (correctCount < 19) avatarElem.innerText = avatars[4];
    else avatarElem.innerText = avatars[6];
}

async function showFinalResult() {
    document.getElementById('quizScreen').classList.remove('active-screen');
    document.getElementById('resultScreen').classList.add('active-screen');
    document.getElementById('finalScore').innerText = score;
    document.getElementById('finalAvatar').innerText = document.getElementById('avatarIcon').innerText;
    triggerCelebration();
    
    const accuracy = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
    document.getElementById('resultDetails').innerHTML = `Siswa: <b>${selectedStudentName}</b><br>Jawaban Benar: <b>${correctCount} / ${TOTAL_QUESTIONS}</b><br>Akurasi: <b>${accuracy}%</b>`;
    await saveScoreToSheet(selectedStudentName, score);
}

async function saveScoreToSheet(name, scoreValue) {
    const statusElem = document.getElementById('savingStatus');
    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, score: scoreValue })
        });
        statusElem.innerText = "✅ Skor berhasil disimpan!";
        statusElem.style.color = "#2e7d32";
    } catch (err) {
        console.error(err);
        statusElem.innerText = "⚠️ Gagal menyimpan skor otomatis.";
        statusElem.style.color = "#c62828";
    }
}

/* =========================================
   LOGIKA BINATANG REALISTIS DENGAN APLIKASI ANIMASI GERAK
========================================= */
const animalsDatabase = [
    { icon: '🦋', motion: 'wing-flap' },     // Kupu-Kupu (Kepak Sayap)
    { icon: '🦜', motion: 'wing-flap' },     // Burung (Kepak Sayap)
    { icon: '🦉', motion: 'wing-flap' },     // Burung Hantu (Kepak Sayap)
    { icon: '🐍', motion: 'snake-slither' },  // Ular (Meliuk Merayap)
    { icon: '🐅', motion: 'limb-walk' },     // Macan (Jalan Beriringan)
    { icon: '🦁', motion: 'limb-walk' },     // Singa (Langkah Kaki)
    { icon: '🐱', motion: 'limb-walk' },     // Kucing (Langkah Kaki)
    { icon: '🐈‍⬛', motion: 'limb-walk' },     // Kucing Hitam
    { icon: '🐕', motion: 'limb-walk' },     // Anjing
    { icon: '🐇', motion: 'limb-walk' },     // Kelinci (Melompat/Berjalan)
    { icon: '🐒', motion: 'limb-walk' },     // Monyet
    { icon: '🦖', motion: 'limb-walk' }      // Dinosaurus
];

const directions = ['left-right', 'right-left', 'top-bottom'];

function spawnRandomAnimal() {
    const wrapper = document.getElementById('animalWrapper');
    const animalElem = document.getElementById('walkingAnimal');
    if (!wrapper || !animalElem) return;

    // Reset Class & Inline Styles
    wrapper.className = 'walking-animal-wrapper';
    animalElem.className = 'walking-animal';
    wrapper.style.top = '';
    wrapper.style.left = '';

    // Ambil hewan acak beserta jenis efek geraknya
    const randomAnimal = animalsDatabase[Math.floor(Math.random() * animalsDatabase.length)];
    const randomDir = directions[Math.floor(Math.random() * directions.length)];
    
    animalElem.innerText = randomAnimal.icon;
    animalElem.classList.add(randomAnimal.motion); // Memasang animasi gerak realistis (sayap/kaki/ular)

    // Atur Posisi Lintasan
    if (randomDir === 'left-right' || randomDir === 'right-left') {
        const randomTop = Math.floor(Math.random() * 45) + 15; // Lintasan melintas kotak (15vh - 60vh)
        wrapper.style.top = `${randomTop}vh`;
        wrapper.classList.add(`animate-${randomDir}`);
    } else if (randomDir === 'top-bottom') {
        const randomLeft = Math.floor(Math.random() * 40) + 30; // Melintas vertikal (30vw - 70vw)
        wrapper.style.left = `${randomLeft}vw`;
        wrapper.classList.add('animate-top-bottom');
    }

    // Durasi Jalan (3.5s - 5.5s)
    const duration = (Math.random() * 2 + 3.5).toFixed(1);
    wrapper.style.animationDuration = `${duration}s`;

    // Reset setelah selesai melintas dan jadwalkan pemunculan berikutnya
    setTimeout(() => {
        wrapper.className = 'walking-animal-wrapper';
        animalElem.className = 'walking-animal';
        
        const nextDelay = Math.floor(Math.random() * (9000 - 3500 + 1)) + 3500;
        setTimeout(spawnRandomAnimal, nextDelay);

    }, duration * 1000);
}

window.onload = () => {
    fetchStudentNames();
    setTimeout(spawnRandomAnimal, 2000);
};
